services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "3001:3000"
    environment:
      AI_SERVICE_URL: http://ai:8000
      ML_SERVICE_URL: http://ml:8001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/groundguard
      REDIS_URL: redis://redis:6379
    depends_on:
      - ai
      - ml
      - postgres
      - redis

  ai:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    ports:
      - "8000:8000"

  ml:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ml
    ports:
      - "8001:8001"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: groundguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
